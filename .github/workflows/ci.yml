name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Vitest, Vite Build & Python Sprite Slicer Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pillow pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest unit & integration suite
        run: npm test

      - name: Build production TypeScript & Vite bundle
        run: npm run build

      - name: Run Python sprite slicer tests (strict deprecation check)
        run: PYTHONPATH=. python -m pytest -W error::DeprecationWarning tests/test_slice_sprite.py
